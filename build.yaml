# GitHub Actions build matrix. ZMK v0.3.0; nice_nano_v2 is the target for the SuperMini nRF52840.
---
include:
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_right
  - board: nice_nano_v2
    shield: settings_reset

  # Same firmware with USB logging, for debugging keys over the serial port.
  # Uses more battery; flash the normal builds for daily use.
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    artifact-name: dactyl_left_LOG
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_right
    snippet: zmk-usb-logging
    artifact-name: dactyl_right_LOG

  # TEMPORARY: do these boards have a 32 kHz crystal? If a half boots and connects
  # on this build, it does, and XTAL can replace SYNTH for better battery life.
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
    artifact-name: test_left_clock_xtal
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
    artifact-name: test_right_clock_xtal
