# GitHub Actions build matrix. ZMK v0.3.0; nice_nano_v2 is the target for the SuperMini nRF52840.
---
include:
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_right
  - board: nice_nano_v2
    shield: settings_reset

  # Same firmware with USB logging, for debugging keys over the serial port.
  # Uses more battery; flash the normal builds for daily use.
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    artifact-name: dactyl_left_LOG
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_right
    snippet: zmk-usb-logging
    artifact-name: dactyl_right_LOG

  # TEMPORARY radio test builds (left half, with logging). Every BLE link from the
  # left half drops with a timeout (reason 0x08/0x3e) right as pairing starts.
  # Each build changes exactly one setting; remove them once the cause is found.
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
    artifact-name: test_left_clock_synth
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_BT_CTLR_TX_PWR_0=y
    artifact-name: test_left_txpwr_0
  - board: nice_nano_v2
    shield: dactyl_manuform_5x6_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_BT_CTLR_DATA_LENGTH_MAX=27 -DCONFIG_BT_AUTO_DATA_LEN_UPDATE=n
    artifact-name: test_left_short_packets
