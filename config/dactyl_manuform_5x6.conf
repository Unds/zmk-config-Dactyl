# Deep sleep after idle (default 15 min); any key wakes it.
CONFIG_ZMK_SLEEP=y

# Eager debounce, as on the Corne.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# SuperMini: many have no 32 kHz crystal, so use the internal RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# SuperMini's chip antenna is weak; max TX power helps the split link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE stability tweaks.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Do NOT enable ZMK_BLE_EXPERIMENTAL_SEC (or EXPERIMENTAL_FEATURES): on this
# setup it made Windows ask for a pairing PIN (tested 2026-09-26).
CONFIG_BT_CTLR_PHY_2M=n

# Report the right half's battery to the computer as well (left half reports its own).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# USB logging is enabled per build via the zmk-usb-logging snippet in build.yaml.
