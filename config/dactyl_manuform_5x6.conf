# Deep sleep after idle (default 15 min); any key wakes it.
CONFIG_ZMK_SLEEP=y

# Eager debounce, as on the Corne.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# These SuperMini boards do have a 32 kHz crystal: verified 2026-10-03, both halves
# boot and link on K32SRC_XTAL. The RC oscillator was too inaccurate (every BLE link
# timed out, reason 0x08/0x3e). SYNTH got through pairing but the split link dropped
# with supervision timeouts within seconds once the peripheral began sleeping between
# connection events, and the right half then got stuck not advertising. XTAL is the
# Zephyr default for nice_nano_v2; set it explicitly so it is never switched back.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# SuperMini's chip antenna is weak; max TX power helps the split link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE stability tweaks.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Do NOT enable ZMK_BLE_EXPERIMENTAL_SEC (or EXPERIMENTAL_FEATURES): on this
# setup it made Windows ask for a pairing PIN (tested 2026-09-26).
CONFIG_BT_CTLR_PHY_2M=n

# Right-half battery reporting (SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING/PROXY) is
# disabled while testing pairing failures that started after it was added.

# USB logging is enabled per build via the zmk-usb-logging snippet in build.yaml.
